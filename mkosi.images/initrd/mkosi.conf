[Include]
Include=../../iota/mkosi.profiles/repartd
Include=../../iota/mkosi.profiles/fs-xfs.conf

[Output]
Output=initrd_%v_%a
Format=cpio
Profiles=ssh-var-luks
CompressOutput=zstd

[Content]
MakeInitrd=yes
SELinuxRelabel=no
Packages=
    systemd
    systemd-udev
    udev
    kmod
    veritysetup
    device-mapper
    util-linux
Locale=C
WithDocs=no
CleanPackageMetadata=yes
