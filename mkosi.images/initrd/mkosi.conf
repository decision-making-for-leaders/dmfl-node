[Output]
Output=initrd_%v_%a
Format=cpio
CompressOutput=zstd

[Config]
Profiles=ssh-var-luks repartd

[Content]
MakeInitrd=yes
SELinuxRelabel=no
Packages=systemd
         systemd-udev
         udev
         kmod
         cryptsetup
         veritysetup
         device-mapper
         util-linux
         xfsprogs
Locale=C
WithDocs=no
CleanPackageMetadata=yes