[Config]
Profiles=repartd-minimal

[Include]
Include=../../iota/mkosi.profiles/repartd

[Output]
Output=initrd_%v_%a
Format=cpio
CompressOutput=zstd

[Content]
MakeInitrd=yes
SELinuxRelabel=no
Packages=
    systemd
    systemd-udev
    udev
    kmod
    veritysetup
    device-mapper
    util-linux
    xfsprogs
Locale=C
WithDocs=no
CleanPackageMetadata=yes
