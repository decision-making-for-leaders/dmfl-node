[Include]
Include=../../iota/mkosi.profiles/repartd
Include=../../iota/mkosi.profiles/fs-xfs.conf
Include=../../mkosi.slot-size.conf

[Output]
Output=initrd_%v_%a
Format=cpio
CompressOutput=zstd

[Content]
MakeInitrd=yes
SELinuxRelabel=no
ExtraTrees=mkosi.extra
Packages=
    systemd
    systemd-udev
    udev
    kmod
    veritysetup
    device-mapper
    util-linux
Locale=C
WithDocs=no
CleanPackageMetadata=yes
