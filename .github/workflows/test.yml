name: Verify mkosi & systemd-sysupdate

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sysupdate-e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup mkosi
        uses: systemd/mkosi@v27

      - name: Setup QEMU & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf systemd-container \
            systemd-ukify sbsigntool socat openssh-client python3-pip systemd-boot \
            systemd-repart python3-pefile binutils mtools erofs-utils xfsprogs zstd dnf policycoreutils

          # Ensure KVM acceleration is accessible
          test -e /dev/kvm && sudo chmod 666 /dev/kvm || true

      - name: Write shared CI helpers
        run: |
          cat > /tmp/ci-lib.sh <<'EOF'
          SSH_CMD="ssh -i /tmp/ci_id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3 -p 2222 root@127.0.0.1"
          FATAL_RE='You are in emergency mode|Give root password for maintenance|Please configure the system|Kernel panic|Timed out waiting for device|Failed to start .*systemd-repart\.service'

          # wait_ssh <tries> <serial-log>
          # Polls SSH, but bails out immediately if the serial log shows a fatal boot state.
          wait_ssh() {
            local tries=$1 log=$2 i
            for ((i = 0; i < tries; i++)); do
              if $SSH_CMD true 2>/dev/null; then
                return 0
              fi
              if grep -qaE "$FATAL_RE" "$log" 2>/dev/null; then
                echo "::error::Fatal boot state detected in $log"
                grep -aE "$FATAL_RE" "$log" | head -n 10 || true
                return 2
              fi
              sleep 2
            done
            echo "::error::SSH never came up (see $log)"
            echo "---- last ssh -v attempt ----"
            $SSH_CMD -v true 2>&1 || true
            return 1
          }

          # unlock_var_ssh <tries> <serial-log> <passphrase>
          # Connects to initrd sshd-unlock, answers passphrase prompts via PTY, and waits for switch-root EOF.
          unlock_var_ssh() {
            local tries=$1 log=$2 passphrase=$3 i rc
            for ((i = 0; i < tries; i++)); do
              rc=0
              python3 - "$passphrase" <<'PY' || rc=$?
          import os, pty, re, select, signal, subprocess, sys, time

          passphrase = sys.argv[1]
          cmd = [
              "ssh", "-tt",
              "-i", "/tmp/ci_id_ed25519",
              "-o", "StrictHostKeyChecking=no",
              "-o", "UserKnownHostsFile=/dev/null",
              "-o", "ConnectTimeout=3",
              "-o", "BatchMode=yes",
              "-p", "2222",
              "root@127.0.0.1",
          ]
          master, slave = pty.openpty()
          proc = subprocess.Popen(cmd, stdin=slave, stdout=slave, stderr=slave, close_fds=True)
          os.close(slave)

          ansi_re = re.compile(rb"\x1b\[[0-9;?]*[ -/]*[@-~]")
          prompt_re = re.compile(rb"(?i)(?:enter new passphrase|confirm passphrase|enter passphrase)[^:\r\n]*:")
          buf = b""
          answered = 0
          eof = False
          deadline = time.monotonic() + 120

          try:
              while time.monotonic() < deadline:
                  r, _, _ = select.select([master], [], [], 1.0)
                  if not r:
                      if proc.poll() is not None:
                          eof = True
                          break
                      continue
                  try:
                      data = os.read(master, 4096)
                  except OSError:
                      eof = True
                      break
                  if not data:
                      eof = True
                      break
                  sys.stdout.buffer.write(data)
                  sys.stdout.buffer.flush()
                  buf = ansi_re.sub(b"", buf + data)
                  if prompt_re.search(buf):
                      os.write(master, (passphrase + "\n").encode())
                      answered += 1
                      buf = b""
          finally:
              os.close(master)
              if proc.poll() is None:
                  proc.send_signal(signal.SIGTERM)
              proc.wait(timeout=5)

          if answered > 0 and eof:
              sys.exit(0)
          if answered > 0 and not eof:
              print("\nunlock_var_ssh: timed out waiting for switch-root EOF", file=sys.stderr)
              sys.exit(2)
          sys.exit(1)
          PY
              if [ "$rc" -eq 0 ]; then
                return 0
              fi
              if grep -qaE "$FATAL_RE" "$log" 2>/dev/null; then
                echo "::error::Fatal boot state detected in $log while unlocking /var"
                grep -aE "$FATAL_RE" "$log" | head -n 10 || true
                return 2
              fi
              if [ "$rc" -eq 2 ]; then
                echo "::error::Timed out waiting for switch-root after answering passphrase prompts (see $log)"
                return 1
              fi
              sleep 2
            done
            echo "::error::Timed out unlocking /var via SSH (see $log)"
            return 1
          }

          # inspect_root <erofs-image-or-device> <label>
          # Mounts a root image read-only and reports where ESP/by-uuid references come from.
          inspect_root() {
            local src=$1 label=$2
            echo "---- [$label] root contents ----"
            sudo mkdir -p /mnt/inspect
            if sudo mount -t erofs -o loop,ro "$src" /mnt/inspect 2>/dev/null; then
              echo "-- /etc/fstab --"
              cat /mnt/inspect/etc/fstab 2>/dev/null || echo "(no fstab)"
              echo "-- ESP / by-uuid references --"
              sudo grep -rnE "CD4B-90CA|367C-F384|by-uuid" \
                /mnt/inspect/etc /mnt/inspect/usr/lib/systemd/system \
                /mnt/inspect/usr/lib/systemd/system-generators 2>/dev/null | head -n 50 || true
              echo "-- /etc/systemd/system --"
              ls -la /mnt/inspect/etc/systemd/system 2>/dev/null | head -n 40 || true
              sudo umount /mnt/inspect
            else
              echo "(could not mount $src as erofs)"
              file "$src" || true
            fi
          }

          # inspect_disk <raw-disk> <label>
          inspect_disk() {
            local disk=$1 label=$2 loop p
            echo "==== [$label] disk layout ===="
            loop=$(sudo losetup -Pf --show "$disk")
            sudo sfdisk -d "$loop" || true
            for p in "${loop}"p*; do
              echo "-- $p --"
              sudo blkid "$p" || true
            done
            for p in "${loop}"p*; do
              if [ "$(sudo blkid -s TYPE -o value "$p" 2>/dev/null)" = "erofs" ]; then
                inspect_root "$p" "$label"
                break
              fi
            done
            sudo losetup -d "$loop"
          }

          # capture_guest_diagnostics <out-file>
          # Captures failed systemd units, dbus-broker/homed journals, SELinux AVCs, and boot errors.
          capture_guest_diagnostics() {
            local out=$1
            $SSH_CMD '
              echo "==== systemctl --failed ===="
              systemctl --failed --no-pager --no-legend || true
              echo "==== dbus-broker & systemd-homed status ===="
              systemctl status dbus-broker.service systemd-homed.service --no-pager -l || true
              echo "==== dbus-broker & systemd-homed journal ===="
              journalctl -b -u dbus-broker.service -u systemd-homed.service --no-pager || true
              echo "==== failed unit journals ===="
              systemctl --failed --no-pager --no-legend | while read -r u _; do
                [ -n "$u" ] || continue
                echo "--- $u ---"
                journalctl -b -u "$u" -n 50 --no-pager || true
              done
              echo "==== SELinux status & AVCs ===="
              getenforce || true
              ausearch -m avc -ts boot 2>/dev/null || grep -i avc /var/log/audit/audit.log 2>/dev/null || journalctl -b | grep -i avc || true
              echo "==== SELinux labels (/var, /etc, /run) ===="
              ls -ldZ /var /var/etc /var/.etc-work /etc /run /run/dbus 2>/dev/null || true
              echo "==== journalctl -b -p err ===="
              journalctl -b -p err -n 200 --no-pager || true
            ' > "$out" 2>&1 || true
          }

          # capture_serial_diagnostics <sock> <out-file>
          # Connects to the QEMU serial unix socket, logs in as root, and captures diagnostics.
          capture_serial_diagnostics() {
            local sock=$1 out=$2
            python3 - "$sock" "$out" <<'PY' || true
          import os, re, select, socket, sys, time

          sock_path, out_path = sys.argv[1], sys.argv[2]
          if not os.path.exists(sock_path):
              with open(out_path, "w") as f:
                  f.write(f"(serial socket {sock_path} does not exist)\n")
              sys.exit(0)

          ansi_re = re.compile(rb"\x1b(?:\[[0-9;?]*[ -/]*[@-~]|\][^\x1b\x07]*(?:\x07|\x1b\\)|[PX^_].*?\x1b\\|[()][AB012]|.)")
          cmd = (
              "ip -br a; ss -tlnp; "
              "systemctl --failed --no-pager --no-legend; "
              "systemctl status sshd.socket 'sshd@*' dbus-broker.service systemd-homed.service --no-pager -l; "
              "journalctl -b -u 'sshd*' -u dbus-broker.service -u systemd-homed.service --no-pager; "
              "getenforce; ausearch -m avc -ts boot 2>/dev/null || grep -i avc /var/log/audit/audit.log 2>/dev/null || journalctl -b | grep -i avc; "
              "ls -ldZ /var /var/etc /var/.etc-work /etc /etc/ssh /etc/ssh/authorized_keys /run /run/dbus 2>/dev/null; "
              "journalctl -b -p err -n 100 --no-pager; "
              'echo "__DIAG""_DONE__"\n'
          ).encode()

          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.settimeout(5.0)
          raw = bytearray()
          try:
              s.connect(sock_path)
              s.setblocking(False)
              s.sendall(b"\n")
              sent_user = False
              sent_pass = False
              sent_cmd = False
              buf = b""
              deadline = time.monotonic() + 60
              while time.monotonic() < deadline:
                  r, _, _ = select.select([s], [], [], 1.0)
                  if not r:
                      if not sent_user:
                          s.sendall(b"\n")
                      continue
                  data = s.recv(4096)
                  if not data:
                      break
                  raw.extend(data)
                  buf = ansi_re.sub(b"", buf + data).replace(b"\r", b"")
                  if not sent_user and re.search(rb"(?:^|\n)[^\n]*login:\s*$", buf):
                      s.sendall(b"root\n")
                      sent_user = True
                      buf = b""
                  elif sent_user and not sent_pass and re.search(rb"Password:\s*$", buf):
                      s.sendall(b"root\n")
                      sent_pass = True
                      buf = b""
                  elif sent_user and not sent_cmd and re.search(rb"(?:^|\n)[^\n]*#\s*$", buf):
                      s.sendall(cmd)
                      sent_pass = True
                      sent_cmd = True
                      buf = b""
                  elif sent_cmd and b"__DIAG_DONE__" in buf:
                      break
          finally:
              s.close()

          cleaned = ansi_re.sub(b"", bytes(raw)).replace(b"\r", b"")
          with open(out_path, "wb") as f:
              f.write(cleaned)
          PY
          }
          EOF

      - name: Prepare SSH Keys, Signing Keys & Test Transfer URLs
        run: |
          if mkosi summary --json | jq -e '.Images[] | select(.Image == "main") | (.Profiles // []) | index("ssh-var-luks") != null' >/dev/null; then
            echo "SSH_VAR_LUKS=true" >> "$GITHUB_ENV"
            SSH_VAR_LUKS=true
          else
            echo "SSH_VAR_LUKS=false" >> "$GITHUB_ENV"
            SSH_VAR_LUKS=false
          fi
          echo "LUKS_PASSPHRASE=ci-test-passphrase" >> "$GITHUB_ENV"

          ssh-keygen -t ed25519 -f /tmp/ci_id_ed25519 -N ""
          mkdir -p mkosi.extra/etc/ssh/sshd_config.d
          cp /tmp/ci_id_ed25519.pub mkosi.extra/etc/ssh/authorized_keys
          chmod 644 mkosi.extra/etc/ssh/authorized_keys
          if [ "$SSH_VAR_LUKS" = "true" ]; then
            mkdir -p mkosi.extra/efi/unlock
            cp /tmp/ci_id_ed25519.pub mkosi.extra/efi/unlock/authorized_keys
            chmod 644 mkosi.extra/efi/unlock/authorized_keys
          fi
          cat > mkosi.extra/etc/ssh/sshd_config.d/99-ci.conf <<'EOF'
          PermitRootLogin prohibit-password
          AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys
          StrictModes no
          EOF

          # Point sysupdate [Source] transfer definitions at the QEMU host HTTP server
          sed -i 's|^Path=https://.*|Path=http://10.0.2.2:8000/|' mkosi.extra/usr/lib/sysupdate.d/*.transfer

          # Enable serial console logging for headless QEMU CI builds only
          mkdir -p mkosi.conf.d
          printf '[Content]\nKernelCommandLine=console=ttyS0,115200n8\n' > mkosi.conf.d/99-ci.conf

      - name: Build v1.0.0 Base Image
        run: |
          set -euo pipefail
          source /tmp/ci-lib.sh

          sudo mkosi --image-version=1.0.0 --force build
          sudo chown -R "$USER:$USER" mkosi.output
          zstd -d mkosi.output/iota_1.0.0_x86-64.raw.zst -o ./disk-test.raw

          {
            inspect_disk ./disk-test.raw "v1.0.0"
            echo "==== [v1.0.0] UKI ===="
            ls -la mkosi.output/
            ukify inspect mkosi.output/iota_1.0.0_x86-64.efi 2>&1 || true
          } 2>&1 | tee /tmp/image-inspect-v100.txt

          # Expand raw disk by 6G so systemd-repart can grow Slot A, create empty Slot B, and format /var
          qemu-img resize -f raw ./disk-test.raw +6G

      - name: Build v1.0.1 Update Payload & Start HTTP Server
        run: |
          set -euo pipefail
          source /tmp/ci-lib.sh

          sudo rm -rf mkosi.output/*
          sudo mkosi --image-version=1.0.1 --force build
          sudo chown -R "$USER:$USER" mkosi.output

          {
            echo "==== [v1.0.1] build output ===="
            ls -la mkosi.output/
            ROOT101=$(find mkosi.output -maxdepth 1 -name 'iota_1.0.1_x86-64.root-*.raw.zst' ! -name '*verity*' | head -n 1)
            if [ -n "$ROOT101" ]; then
              zstd -dc "$ROOT101" > /tmp/root101.raw
              inspect_root /tmp/root101.raw "v1.0.1"
              rm -f /tmp/root101.raw
            else
              echo "(no non-verity root image found to inspect)"
            fi
            echo "==== [v1.0.1] UKI ===="
            ukify inspect mkosi.output/iota_1.0.1_x86-64.efi 2>&1 || true
          } 2>&1 | tee /tmp/image-inspect-v101.txt

          mkdir -p /tmp/update-srv
          cp mkosi.output/iota_1.0.1_x86-64.root-*.raw.zst /tmp/update-srv/
          cp mkosi.output/iota_1.0.1_x86-64.efi /tmp/update-srv/

          cd /tmp/update-srv
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          setsid nohup python3 -m http.server 8000 --bind 0.0.0.0 > /tmp/http-server.log 2>&1 &
          echo "HTTP_PID=$!" >> "$GITHUB_ENV"

      - name: Boot v1.0.0 (UEFI), Verify systemd-repart & Run systemd-sysupdate
        run: |
          set -euo pipefail
          source /tmp/ci-lib.sh

          # Copy writable OVMF_VARS so UEFI boot entries persist across reboots
          cp /usr/share/OVMF/OVMF_VARS_4M.fd ./ovmf_vars.fd
          : > /tmp/serial-boot1.log
          rm -f /tmp/serial-boot1.sock

          qemu-system-x86_64 \
            -enable-kvm -cpu host -m 2G -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=./ovmf_vars.fd \
            -drive file=./disk-test.raw,format=raw,if=virtio \
            -net nic,model=virtio \
            -device i6300esb -watchdog-action reset \
            -net user,hostfwd=tcp:127.0.0.1:2222-:22 \
            -display none -monitor none \
            -chardev socket,id=ser0,path=/tmp/serial-boot1.sock,server=on,wait=off,logfile=/tmp/serial-boot1.log,logappend=on \
            -serial chardev:ser0 \
            -no-reboot &
          QEMU_PID=$!
          trap 'kill $QEMU_PID 2>/dev/null || true' EXIT

          if [ "${SSH_VAR_LUKS:-false}" = "true" ]; then
            echo "Unlocking /var via initrd SSH for v1.0.0..."
            unlock_var_ssh 45 /tmp/serial-boot1.log "$LUKS_PASSPHRASE"
          fi

          echo "Waiting for v1.0.0 guest SSH..."
          if ! wait_ssh 60 /tmp/serial-boot1.log; then
            capture_serial_diagnostics /tmp/serial-boot1.sock /tmp/guest-diag-boot1.txt
            exit 1
          fi
          capture_guest_diagnostics /tmp/guest-diag-boot1.txt

          # 1. Verify systemd-repart.service succeeded on boot (runs in initrd; skipped in real root when repart.d is initrd-only)
          $SSH_CMD '
            set -euo pipefail
            systemctl status systemd-repart.service --no-pager || true
            test "$(systemctl show -p Result --value systemd-repart.service)" = "success"
            journalctl -b -u systemd-repart.service --no-pager | grep -q "Finished systemd-repart.service"
          '

          # 2. Verify the partition table actually has the '_empty' B slots and /var
          $SSH_CMD "lsblk -o NAME,PARTLABEL,PARTTYPE,PARTUUID,SIZE"
          $SSH_CMD "blkid -t PARTLABEL=_empty"

          # 3. Verify persistent /var and /etc overlay are mounted and write test markers
          if [ "${SSH_VAR_LUKS:-false}" = "true" ]; then
            $SSH_CMD 'test "$(findmnt -n -o SOURCE /var)" = "/dev/mapper/var"'
          else
            $SSH_CMD 'test "$(findmnt -n -o SOURCE /var)" = "$(blkid -t PARTLABEL=var -o device)"'
          fi
          $SSH_CMD 'test "$(findmnt -n -o FSTYPE /etc)" = "overlay"'
          $SSH_CMD 'getenforce | grep -qx Enforcing'
          $SSH_CMD 'mkdir -p /var/lib && echo "var-persisted-from-1.0.0" > /var/lib/persist-test'
          $SSH_CMD 'echo "etc-persisted-from-1.0.0" > /etc/persist-etc-test'

          # Record how the ESP is mounted on the running v1.0.0 system (useful for debugging UUID mismatches)
          $SSH_CMD 'findmnt /efi; blkid | grep -i vfat; cat /etc/fstab 2>/dev/null || true' | tee /tmp/guest-esp-v100.txt

          # 4. Verify systemd-sysupdate sees the empty slot and the remote v1.0.1 update
          $SSH_CMD "/usr/lib/systemd/systemd-sysupdate components"
          $SSH_CMD "/usr/lib/systemd/systemd-sysupdate list --verify=no"

          # 5. Run the update and verify '_empty' became 'iota_1.0.1' and boot-counted UKI exists
          $SSH_CMD "/usr/lib/systemd/systemd-sysupdate update --verify=no"
          $SSH_CMD "lsblk -o NAME,PARTLABEL,PARTUUID,SIZE"
          $SSH_CMD 'ESP_DIR=$(bootctl --print-esp-path) && ls -la "$ESP_DIR/EFI/Linux/" && test -f "$ESP_DIR/EFI/Linux/iota_1.0.1_x86-64+3-0.efi"'

          # Power off cleanly so filesystems and EFI vars flush
          $SSH_CMD "systemctl poweroff" || true
          for i in {1..45}; do
            kill -0 "$QEMU_PID" 2>/dev/null || break
            sleep 2
          done
          wait "$QEMU_PID" || true

      - name: Boot Updated Slot, Verify Blessing & Persistence, and Test Automatic Rollback
        run: |
          set -euo pipefail
          source /tmp/ci-lib.sh

          : > /tmp/serial-boot2.log
          rm -f /tmp/serial-boot2.sock

          # No -no-reboot here: the rollback test relies on the guest rebooting itself.
          qemu-system-x86_64 \
            -enable-kvm -cpu host -m 2G -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=./ovmf_vars.fd \
            -drive file=./disk-test.raw,format=raw,if=virtio \
            -net nic,model=virtio \
            -device i6300esb -watchdog-action reset \
            -net user,hostfwd=tcp:127.0.0.1:2222-:22 \
            -display none -monitor none \
            -chardev socket,id=ser0,path=/tmp/serial-boot2.sock,server=on,wait=off,logfile=/tmp/serial-boot2.log,logappend=on \
            -serial chardev:ser0 &
          QEMU_PID=$!
          trap 'kill $QEMU_PID 2>/dev/null || true' EXIT

          if [ "${SSH_VAR_LUKS:-false}" = "true" ]; then
            echo "Unlocking /var via initrd SSH for v1.0.1..."
            unlock_var_ssh 45 /tmp/serial-boot2.log "$LUKS_PASSPHRASE"
          fi

          echo "Waiting for v1.0.1 guest SSH..."
          if ! wait_ssh 60 /tmp/serial-boot2.log; then
            capture_serial_diagnostics /tmp/serial-boot2.sock /tmp/guest-diag-boot2.txt
            exit 1
          fi
          capture_guest_diagnostics /tmp/guest-diag-boot2.txt

          $SSH_CMD "lsblk -o NAME,PARTLABEL,PARTUUID,MOUNTPOINTS,SIZE"
          BOOTED_VER=$($SSH_CMD ". /usr/lib/os-release && echo \$IMAGE_VERSION")
          echo "Booted Version: $BOOTED_VER"
          test "$BOOTED_VER" = "1.0.1"

          # Verify /dev/mapper/root is backed by the iota_1.0.1 partition (Slot B)
          $SSH_CMD "lsblk -s -no PARTLABEL /dev/mapper/root | grep -qx iota_1.0.1"

          # Verify persistent /var and /etc overlay survived the A -> B slot switch
          if [ "${SSH_VAR_LUKS:-false}" = "true" ]; then
            $SSH_CMD 'test "$(findmnt -n -o SOURCE /var)" = "/dev/mapper/var"'
          else
            $SSH_CMD 'test "$(findmnt -n -o SOURCE /var)" = "$(blkid -t PARTLABEL=var -o device)"'
          fi
          $SSH_CMD 'test "$(findmnt -n -o FSTYPE /etc)" = "overlay"'
          $SSH_CMD 'getenforce | grep -qx Enforcing'
          $SSH_CMD 'test "$(cat /var/lib/persist-test)" = "var-persisted-from-1.0.0"'
          $SSH_CMD 'test "$(cat /etc/persist-etc-test)" = "etc-persisted-from-1.0.0"'

          # Verify systemd-boot decremented +3-0 -> +2-1 and systemd-bless-boot marks it good
          verify_bless_boot() {
            $SSH_CMD '
              set -euo pipefail
              ESP_DIR=$(bootctl --print-esp-path)
              BOOTCOUNT_VAR="/sys/firmware/efi/efivars/LoaderBootCountPath-4a67b082-0a4c-41cf-b6c7-440b29bb8c4f"
              test -f "$BOOTCOUNT_VAR"
              tr -d "\0" < "$BOOTCOUNT_VAR" | grep -qaF "iota_1.0.1_x86-64+2-1.efi"
              BLESS_STATUS=$(/usr/lib/systemd/systemd-bless-boot status || true)
              if [ "$BLESS_STATUS" != "good" ]; then
                test -f "$ESP_DIR/EFI/Linux/iota_1.0.1_x86-64+2-1.efi"
              fi
              systemctl start systemd-bless-boot.service
              /usr/lib/systemd/systemd-bless-boot status | grep -qx good
              ls -la "$ESP_DIR/EFI/Linux/"
              test -f "$ESP_DIR/EFI/Linux/iota_1.0.1_x86-64.efi"
              ! find "$ESP_DIR/EFI/Linux/" -maxdepth 1 -name "iota_1.0.1_x86-64+*.efi" | grep -q .
            '
          }

          if ! verify_bless_boot; then
            echo "::group::bless-boot diagnostics"
            $SSH_CMD '
              systemctl status systemd-bless-boot.service --no-pager -l
              journalctl -b -u systemd-bless-boot.service --no-pager
              bootctl status --no-pager
              ls -la /sys/firmware/efi/efivars | grep -iE "loader|bootcount" || true
              cat /sys/firmware/efi/efivars/LoaderBootCountPath-* 2>/dev/null | tr -d '\0'; echo
              findmnt /boot /efi || true
              ls -ladZ "$(bootctl --print-esp-path)/EFI/Linux/" || true
              ausearch -m avc -ts boot 2>/dev/null || journalctl -b | grep -i avc || true
              /usr/lib/systemd/systemd-bless-boot status || true
            ' || true
            echo "::endgroup::"
            exit 1
          fi
              
          # Simulate a bad update with 1 try remaining that reboots before boot-complete.target
          $SSH_CMD 'ESP_DIR=$(bootctl --print-esp-path) && mv "$ESP_DIR/EFI/Linux/iota_1.0.1_x86-64.efi" "$ESP_DIR/EFI/Linux/iota_1.0.1_x86-64+1-0.efi"'
          $SSH_CMD 'set -euo pipefail
          mkdir -p /etc/systemd/system/systemd-bless-boot.service.d
          cat > /etc/systemd/system/systemd-bless-boot.service.d/simulate-bad-update.conf <<'"'"'EOF'"'"'
          [Unit]
          ConditionOSRelease=IMAGE_VERSION=1.0.1
          Before=sshd.service multi-user.target
          FailureAction=reboot-force

          [Service]
          ExecStart=
          ExecStart=/usr/bin/false
          EOF
          sync'

          echo "Rebooting into simulated bad v1.0.1 (+1-0) to verify automatic fallback to v1.0.0..."
          # Mark where the rollback boot output starts so failures can be located in the serial log
          echo "=== CI: issuing reboot into simulated bad v1.0.1 ===" >> /tmp/serial-boot2.log
          $SSH_CMD "touch /run/awaiting-rollback && systemctl reboot" || true

          for i in {1..30}; do
            $SSH_CMD "test -f /run/awaiting-rollback" 2>/dev/null || break
            sleep 1
          done
          if [ "${SSH_VAR_LUKS:-false}" = "true" ]; then
            echo "Unlocking /var via initrd SSH for doomed v1.0.1 (+1-0)..."
            unlock_var_ssh 45 /tmp/serial-boot2.log "$LUKS_PASSPHRASE"
            echo "Unlocking /var via initrd SSH for rolled-back v1.0.0..."
            unlock_var_ssh 45 /tmp/serial-boot2.log "$LUKS_PASSPHRASE"
          fi
          if ! wait_ssh 75 /tmp/serial-boot2.log; then
            capture_serial_diagnostics /tmp/serial-boot2.sock /tmp/guest-diag-boot2.txt
            exit 1
          fi

          ROLLBACK_VER=$($SSH_CMD ". /usr/lib/os-release && echo \$IMAGE_VERSION")
          echo "Rolled-back Booted Version: $ROLLBACK_VER"
          test "$ROLLBACK_VER" = "1.0.0"

          # Verify fallback booted Slot A (iota_1.0.0), v1.0.1 exhausted tries (+0-1), and state stayed intact
          $SSH_CMD "lsblk -s -no PARTLABEL /dev/mapper/root | grep -qx iota_1.0.0"
          $SSH_CMD 'ESP_DIR=$(bootctl --print-esp-path) && ls -la "$ESP_DIR/EFI/Linux/" && test -f "$ESP_DIR/EFI/Linux/iota_1.0.1_x86-64+0-1.efi"'
          $SSH_CMD 'test "$(cat /var/lib/persist-test)" = "var-persisted-from-1.0.0"'
          $SSH_CMD 'test "$(cat /etc/persist-etc-test)" = "etc-persisted-from-1.0.0"'

          # Clean up the simulated bad-update service from the persistent /etc overlay
          $SSH_CMD "rm -f /etc/systemd/system/sysinit.target.wants/simulate-bad-update.service /etc/systemd/system/simulate-bad-update.service && systemctl daemon-reload"

          $SSH_CMD "systemctl poweroff" || true
          for i in {1..45}; do
            kill -0 "$QEMU_PID" 2>/dev/null || break
            sleep 2
          done
          wait "$QEMU_PID" || true

      - name: Show serial logs on failure
        if: failure()
        run: |
          for f in /tmp/guest-diag-boot1.txt /tmp/guest-diag-boot2.txt; do
            if [ -s "$f" ]; then
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
            fi
          done
          for f in /tmp/serial-boot1.log /tmp/serial-boot2.log; do
            echo "::group::tail of $f"
            tail -n 300 "$f" 2>/dev/null || echo "(missing)"
            echo "::endgroup::"
          done
          echo "::group::image inspection"
          cat /tmp/image-inspect-v100.txt /tmp/image-inspect-v101.txt 2>/dev/null || echo "(missing)"
          echo "::endgroup::"

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sysupdate-e2e-debug
          if-no-files-found: ignore
          path: |
            /tmp/guest-diag-boot1.txt
            /tmp/guest-diag-boot2.txt
            /tmp/serial-boot1.log
            /tmp/serial-boot2.log
            /tmp/image-inspect-v100.txt
            /tmp/image-inspect-v101.txt
            /tmp/guest-esp-v100.txt
            /tmp/http-server.log

      - name: Cleanup background processes
        if: always()
        run: |
          pkill -f qemu-system-x86_64 || true
          if [ -n "${HTTP_PID:-}" ]; then kill "$HTTP_PID" 2>/dev/null || true; fi